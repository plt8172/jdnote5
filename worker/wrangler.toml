# JD노트 승인·게시 Worker (Semifeed Worker와 별개로 배포한다)
# 배포 절차는 worker/README.md 참고. 시크릿은 이 파일이 아니라 `wrangler secret put`으로 등록한다.
name = "jdnote"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
# jdnote5 Instagram 계정 id (Unified login). GET https://graph.facebook.com/v26.0/<id>?fields=username 이 jdnote5를 돌려줘야 한다.
IG_USER_ID = "17841441080715865"
IG_API_VERSION = "v26.0"
# post.json·슬라이드를 읽을 위치. slack_post.py의 raw URL과 같아야 한다.
POSTS_BASE_URL = "https://raw.githubusercontent.com/plt8172/jdnote5/main/posts"

# 처리 상태, 대기 중인 게시. `npx wrangler kv namespace create STATE`로 만든 id로 바꾼다.
[[kv_namespaces]]
binding = "STATE"
id = "b9bb79c30462417a941522ae3dba1bf6"

[triggers]
# 1분마다: 끝나지 않은 게시 작업(KV pending:*)을 이어서 진행
crons = ["* * * * *"]
